[project]
name = "glyph-cutter"
version = "0.1.0"
description = "Cut square character crops out of scanned classical books"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "mkpoli" }]
keywords = ["kuzushiji", "hanzi", "cjk", "paleography", "character-detection", "crops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=2",
    "opencv-python-headless>=4.11",
    "pillow>=11",
    "pymupdf>=1.24",
    "typer>=0.16",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.22"]
gpu = ["onnxruntime-gpu>=1.22"]

[project.scripts]
glyph-cutter = "glyph_cutter.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12", "onnxruntime>=1.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glyph_cutter"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
